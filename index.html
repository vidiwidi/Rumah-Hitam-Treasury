<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pos Keuangan Keluarga</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js CDN untuk Grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Pos Keuangan Keluarga</h1>
    </header>

    <!-- Ringkasan Saldo -->
    <section class="summary-cards">
      <div class="card income">
        <h3>Pemasukan</h3>
        <p id="total-income">Rp 0</p>
      </div>
      <div class="card expense">
        <h3>Pengeluaran</h3>
        <p id="total-expense">Rp 0</p>
      </div>
      <div class="card balance">
        <h3>Sisa Saldo</h3>
        <p id="total-balance">Rp 0</p>
      </div>
    </section>

    <!-- Form Input Transaksi -->
    <section class="form-section">
      <h2>Tambah Transaksi Baru</h2>
      <form id="transaction-form">
        <input type="text" id="title" placeholder="Keterangan (misal: Belanja)" required>
        <input type="number" id="amount" placeholder="Jumlah (Rp)" required>
        <select id="type">
          <option value="expense">Pengeluaran</option>
          <option value="income">Pemasukan</option>
        </select>
        <select id="category">
          <option value="Dapur">Dapur & Makan</option>
          <option value="Tagihan">Tagihan & Listrik</option>
          <option value="Pendidikan">Pendidikan Anak</option>
          <option value="Tabungan">Tabungan & Investasi</option>
          <option value="Lainnya">Lain-lain</option>
        </select>
        <button type="submit">Simpan Transaksi</button>
      </form>
    </section>

    <!-- Visualisasi & Tabel -->
    <section class="dashboard-grid">
      <div class="chart-container">
        <h2>Sebaran Pengeluaran</h2>
        <canvas id="expenseChart"></canvas>
      </div>

      <div class="table-container">
        <h2>Riwayat Transaksi</h2>
        <table id="transaction-table">
          <thead>
            <tr>
              <th>Keterangan</th>
              <th>Kategori</th>
              <th>Tipe</th>
              <th>Jumlah</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
            <!-- Data dari JS akan muncul di sini -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Firebase SDK (Modular Version 10+) -->
  <script type="module" src="app.js"></script>
</body>
</html>
